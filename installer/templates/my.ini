[mysqld]
basedir="__BASEDIR__"
datadir="__DATADIR__"
port=__PORT__
bind-address=127.0.0.1
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
log-error="__ERRORLOG__"
pid-file="__PIDFILE__"
innodb_buffer_pool_size=256M
max_connections=80
max_allowed_packet=64M

[client]
port=__PORT__
protocol=tcp
