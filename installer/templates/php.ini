[PHP]
engine=On
short_open_tag=Off
precision=14
output_buffering=4096
zlib.output_compression=Off
implicit_flush=Off
serialize_precision=-1
disable_functions=
disable_classes=
zend.enable_gc=On
zend.exception_ignore_args=On
expose_php=Off
max_execution_time=600
max_input_time=120
memory_limit=512M
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log="__LOG__/php/php-error.log"
variables_order="GPCS"
request_order="GP"
register_argc_argv=Off
auto_globals_jit=On
post_max_size=64M
upload_max_filesize=64M
max_file_uploads=20
allow_url_fopen=On
allow_url_include=Off
default_socket_timeout=60
date.timezone=Asia/Damascus
extension_dir="__PHPDIR__/ext"
extension=bcmath
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=exif
extension=mysqli
extension=openssl
extension=pdo_mysql
extension=sodium
extension=zip
cgi.force_redirect=0
cgi.fix_pathinfo=1
fastcgi.impersonate=1
fastcgi.logging=0
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.validate_timestamps=1
opcache.revalidate_freq=0
